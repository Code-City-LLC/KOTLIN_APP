name: Connected session gate

on:
  pull_request:
    branches: [main]
    # ⚠️ INTENTIONALLY NOT path-filtered. This gate is REQUIRED by branch
    # protection, and a required + path-filtered workflow fails in two ways at
    # once: a PR touching only unlisted paths can never start it (so it can
    # never merge), AND it merges with zero runtime coverage if the filter is
    # later relaxed. delivery/, designsystem/ and shipments/ were each
    # discovered mid-deadlock. The allowlist also never selected WHICH tests
    # ran — that is driven by connected-session-gate.sh — so it was a 23-entry
    # on/off switch masquerading as a coverage map. Do not reintroduce it.
  workflow_dispatch:
    inputs:
      extra_classes:
        description: Comma- or whitespace-separated fully qualified instrumentation classes
        required: false
        type: string

concurrency:
  group: connected-session-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-connected:
    name: Prod and Staging session runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONNECTED_SESSION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CONNECTED_SESSION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CONNECTED_SESSION_EXTRA_CLASSES: ${{ inputs.extra_classes }}

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Record exact checkout provenance
        run: |
          set -euo pipefail
          printf 'event=%s\n' "${GITHUB_EVENT_NAME}"
          printf 'ref=%s\n' "${GITHUB_REF}"
          printf 'sha=%s\n' "${GITHUB_SHA}"
          printf 'head=%s\n' "$(git rev-parse HEAD)"
          printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})"

      - name: Verify connected-session selection and XML contract
        run: bash .github/scripts/connected-session-gate.sh --self-test

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run focused Prod and Staging connected tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/connected-session-gate.sh

      - name: Upload connected test reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4b # v5
        with:
          name: connected-session-reports-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/connected-session-proof/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 7
