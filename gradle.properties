org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ⚠️ PLAY VITALS: "Optimized resource shrinking isn't enabled".
#
# isShrinkResources=true already runs the shrinker; this makes it PRECISE —
# it removes resources R8 proved unreachable instead of only blanking them,
# which is the memory/size win Play is asking for.
#
# Play also advises "upgrade AGP to 9.0 or higher". NOT DONE, deliberately:
# AGP 9 is a major toolchain jump, and R8 full mode — the substantive half of
# that advice — is ALREADY default-on from AGP 8.0, which we are past at
# 8.10.1. Taking a major AGP bump on a 19-day Play deadline, against a branch
# under a payment hold, would risk the release we are trying to unblock.
# Flagged for an owner decision rather than done unilaterally.
android.enableNewResourceShrinker.preciseShrinking=true
